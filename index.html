<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MY WISHLIST</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f7f7f5;
  color: #222;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Apple SD Gothic Neo",
    "Noto Sans KR",
    sans-serif;
}

header {
  max-width: 900px;
  margin: auto;
  padding: 42px 22px 25px;
}

.logo {
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -1.5px;
}

.subtitle {
  margin-top: 8px;
  color: #888;
  font-size: 15px;
}

/* 돈 카드 */

.money-card {
  max-width: 900px;
  margin: 0 auto 28px;
  padding: 27px;
  background: white;
  border-radius: 25px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.06);
}

.money-title {
  color: #777;
  font-size: 14px;
  margin-bottom: 8px;
}

.money {
  font-size: 36px;
  font-weight: 800;
  margin-bottom: 20px;
}

.progress-background {
  width: 100%;
  height: 12px;
  background: #ededed;
  border-radius: 20px;
  overflow: hidden;
}

.progress {
  height: 100%;
  width: 0%;
  background: #a6b892;
  border-radius: 20px;
  transition: 0.3s;
}

.goal-row {
  display: flex;
  justify-content: space-between;
  margin-top: 10px;
  color: #999;
  font-size: 13px;
}

/* 돈 입력 */

.money-settings {
  margin-top: 18px;
  display: flex;
  gap: 8px;
}

.money-settings input {
  flex: 1;
  min-width: 0;
  padding: 11px;
  border: 1px solid #ddd;
  border-radius: 12px;
  font-size: 14px;
}

.money-settings button {
  border: none;
  background: #222;
  color: white;
  padding: 0 17px;
  border-radius: 12px;
}

/* 카테고리 */

.section {
  max-width: 900px;
  margin: 0 auto;
  padding: 0 22px;
}

.section-title {
  font-size: 22px;
  font-weight: 750;
  margin: 25px 0 15px;
}

.categories {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}

.category {
  border: none;
  background: white;
  border-radius: 22px;
  min-height: 125px;
  box-shadow: 0 4px 17px rgba(0,0,0,0.05);
  cursor: pointer;
  transition: 0.15s;
}

.category:active {
  transform: scale(0.97);
}

.category .emoji {
  display: block;
  font-size: 34px;
  margin-bottom: 10px;
}

.category .name {
  color: #3578e5;
  font-size: 15px;
  font-weight: 600;
}

/* 목록 화면 */

#categoryView {
  display: none;
}

.back {
  border: none;
  background: white;
  padding: 10px 15px;
  border-radius: 12px;
  font-size: 14px;
  cursor: pointer;
  margin-bottom: 15px;
}

.add-box {
  background: white;
  border-radius: 22px;
  padding: 20px;
  box-shadow: 0 4px 17px rgba(0,0,0,0.05);
  margin-bottom: 18px;
}

.add-box input,
.add-box select {
  width: 100%;
  padding: 13px;
  margin-bottom: 9px;
  border: 1px solid #ddd;
  border-radius: 12px;
  font-size: 14px;
  background: white;
}

.add-box button {
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 12px;
  background: #a6b892;
  color: white;
  font-size: 15px;
  font-weight: 600;
}

/* 아이템 */

.items {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}

.item {
  background: white;
  border-radius: 20px;
  padding: 18px;
  box-shadow: 0 4px 17px rgba(0,0,0,0.05);
}

.item h3 {
  margin: 0 0 8px;
  font-size: 17px;
}

.price {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 7px;
}

.memo {
  color: #888;
  font-size: 13px;
  line-height: 1.5;
}

.item-buttons {
  display: flex;
  gap: 7px;
  margin-top: 13px;
}

.item-buttons button {
  flex: 1;
  border: none;
  padding: 8px;
  border-radius: 9px;
  cursor: pointer;
}

.buy {
  background: #edf3e8;
  color: #657555;
}

.delete {
  background: #f5eeee;
  color: #a66;
}

.empty {
  text-align: center;
  padding: 45px 10px;
  color: #aaa;
}

/* 모바일 */

@media (max-width: 600px) {

  header {
    padding-top: 32px;
  }

  .logo {
    font-size: 30px;
  }

  .categories {
    grid-template-columns: repeat(2, 1fr);
  }

  .items {
    grid-template-columns: 1fr;
  }

  .money-settings {
    flex-direction: column;
  }

  .money-settings button {
    padding: 12px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">MY WISHLIST</div>
  <div class="subtitle">사고 싶은 것들을 모아두는 곳 🛒</div>
</header>

<!-- 돈 카드 -->

<div class="money-card">

  <div class="money-title">💰 현재 모은 돈</div>

  <div class="money">
    ₩<span id="savedMoney">0</span>
  </div>

  <div class="progress-background">
    <div class="progress" id="progress"></div>
  </div>

  <div class="goal-row">
    <span>목표 금액</span>
    <span>₩<span id="goalMoney">100000</span></span>
  </div>

  <div class="money-settings">
    <input
      id="moneyInput"
      type="number"
      placeholder="현재 모은 돈"
    >

    <input
      id="goalInput"
      type="number"
      placeholder="목표 금액"
    >

    <button onclick="saveMoney()">저장</button>
  </div>

</div>

<!-- 홈 -->

<div id="home">

  <div class="section">

    <div class="section-title">카테고리</div>

    <div class="categories">

      <button class="category" onclick="openCategory('애니메이션')">
        <span class="emoji">🎬</span>
        <span class="name">애니메이션</span>
      </button>

      <button class="category" onclick="openCategory('아이돌')">
        <span class="emoji">🎤</span>
        <span class="name">아이돌</span>
      </button>

      <button class="category" onclick="openCategory('책')">
        <span class="emoji">📚</span>
        <span class="name">책</span>
      </button>

      <button class="category" onclick="openCategory('신발')">
        <span class="emoji">👟</span>
        <span class="name">신발</span>
      </button>

      <button class="category" onclick="openCategory('옷')">
        <span class="emoji">👕</span>
        <span class="name">옷</span>
      </button>

      <button class="category" onclick="openCategory('장난감')">
        <span class="emoji">🧸</span>
        <span class="name">장난감</span>
      </button>

    </div>

  </div>

</div>


<!-- 카테고리 내부 -->

<div id="categoryView">

  <div class="section">

    <button class="back" onclick="goHome()">← 카테고리로</button>

    <div class="section-title" id="categoryTitle"></div>

    <div class="add-box">

      <input
        id="itemName"
        type="text"
        placeholder="사고 싶은 물건 이름"
      >

      <input
        id="itemPrice"
        type="number"
        placeholder="가격"
      >

      <input
        id="itemMemo"
        type="text"
        placeholder="메모"
      >

      <button onclick="addItem()">
        ＋ 위시리스트에 추가
      </button>

    </div>

    <div class="items" id="items"></div>

  </div>

</div>


<script>

let items = JSON.parse(localStorage.getItem("wishlistItems")) || [];

let savedMoney =
  Number(localStorage.getItem("savedMoney")) || 0;

let goalMoney =
  Number(localStorage.getItem("goalMoney")) || 100000;

let currentCategory = "";


/* 돈 */

function updateMoney() {

  document.getElementById("savedMoney").textContent =
    savedMoney.toLocaleString();

  document.getElementById("goalMoney").textContent =
    goalMoney.toLocaleString();

  let percent = 0;

  if (goalMoney > 0) {
    percent = Math.min(
      (savedMoney / goalMoney) * 100,
      100
    );
  }

  document.getElementById("progress").style.width =
    percent + "%";
}


function saveMoney() {

  const money =
    Number(document.getElementById("moneyInput").value);

  const goal =
    Number(document.getElementById("goalInput").value);

  if (!isNaN(money)) {
    savedMoney = money;
  }

  if (!isNaN(goal) && goal > 0) {
    goalMoney = goal;
  }

  localStorage.setItem("savedMoney", savedMoney);
  localStorage.setItem("goalMoney", goalMoney);

  document.getElementById("moneyInput").value = "";
  document.getElementById("goalInput").value = "";

  updateMoney();
}


/* 카테고리 */

function openCategory(category) {

  currentCategory = category;

  document.getElementById("home").style.display = "none";
  document.getElementById("categoryView").style.display = "block";

  document.getElementById("categoryTitle").textContent =
    category;

  renderItems();
}


function goHome() {

  document.getElementById("categoryView").style.display = "none";
  document.getElementById("home").style.display = "block";
}


/* 아이템 추가 */

function addItem() {

  const name =
    document.getElementById("itemName").value.trim();

  const price =
    Number(document.getElementById("itemPrice").value) || 0;

  const memo =
    document.getElementById("itemMemo").value.trim();

  if (!name) {
    alert("물건 이름을 입력해줘!");
    return;
  }

  items.push({

    id: Date.now(),

    name: name,

    price: price,

    memo: memo,

    category: currentCategory

  });

  localStorage.setItem(
    "wishlistItems",
    JSON.stringify(items)
  );

  document.getElementById("itemName").value = "";
  document.getElementById("itemPrice").value = "";
  document.getElementById("itemMemo").value = "";

  renderItems();
}


/* 아이템 표시 */

function renderItems() {

  const box =
    document.getElementById("items");

  const filtered =
    items.filter(
      item => item.category === currentCategory
    );

  if (filtered.length === 0) {

    box.innerHTML = `
      <div class="empty">
        아직 등록한 물건이 없어!
      </div>
    `;

    return;
  }

  box.innerHTML = filtered.map(item => `

    <div class="item">

      <h3>${escapeHTML(item.name)}</h3>

      <div class="price">
        ₩${item.price.toLocaleString()}
      </div>

      ${
        item.memo
        ? `<div class="memo">${escapeHTML(item.memo)}</div>`
        : ""
      }

      <div class="item-buttons">

        <button
          class="buy"
          onclick="markBought(${item.id})">
          ✓ 구매함
        </button>

        <button
          class="delete"
          onclick="deleteItem(${item.id})">
          삭제
        </button>

      </div>

    </div>

  `).join("");
}


/* 구매 완료 */

function markBought(id) {

  const item =
    items.find(item => item.id === id);

  if (!item) return;

  item.bought = true;

  localStorage.setItem(
    "wishlistItems",
    JSON.stringify(items)
  );

  renderItems();
}


/* 삭제 */

function deleteItem(id) {

  items =
    items.filter(item => item.id !== id);

  localStorage.setItem(
    "wishlistItems",
    JSON.stringify(items)
  );

  renderItems();
}


/* HTML 안전 처리 */

function escapeHTML(text) {

  return text
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


updateMoney();

</script>

</body>
</html>
